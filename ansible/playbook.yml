---
- name: Configure server and deploy Dockerized application
  hosts: app_servers
  become: true
  vars:
    app_dir: /opt/sample-app
    image_name: sample-app
    container_name: sample-app
    host_port: 80
    container_port: 5000

  tasks:
    # -------------------------------------------------------------------
    # 1. Base system setup
    # -------------------------------------------------------------------
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present

    # -------------------------------------------------------------------
    # 2. Install Docker
    # -------------------------------------------------------------------
    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Ensure Docker service is enabled and started on boot
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # -------------------------------------------------------------------
    # 3. Ship application source and build/run the container
    # -------------------------------------------------------------------
    - name: Create application directory on server
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        mode: "0755"

    - name: Copy application source files to server
      copy:
        src: "../app/"
        dest: "{{ app_dir }}"
        owner: ubuntu

    - name: Build Docker image from Dockerfile
      community.docker.docker_image:
        name: "{{ image_name }}"
        build:
          path: "{{ app_dir }}"
        source: build
        force_source: true

    - name: Run the application container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: always
        ports:
          - "{{ host_port }}:{{ container_port }}"
